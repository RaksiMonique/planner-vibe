<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Brain Life Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="d-flex" id="wrapper">
    <div class="p-3 d-flex flex-column" id="sidebar">
        <h3 class="text-center mb-4">Second Brain</h3>
        <nav class="nav flex-column">
            <a class="nav-link active" href="#" data-section="dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="#" data-section="calendar"><i class="bi bi-calendar3 me-2"></i> Calendar & Tasks</a>
            <a class="nav-link" href="#" data-section="bible"><i class="bi bi-book me-2"></i> Bible Study</a>
            <a class="nav-link" href="#" data-section="habits"><i class="bi bi-check2-circle me-2"></i> Habit Tracker</a>
            <a class="nav-link" href="#" data-section="segments"><i class="bi bi-pie-chart me-2"></i> Life Segments</a>
            <a class="nav-link" href="#" data-section="meals"><i class="bi bi-egg-fried me-2"></i> Meal Planner</a>
            <a class="nav-link" href="#" data-section="journal"><i class="bi bi-pencil-square me-2"></i> Journal</a>
            <a class="nav-link" href="#" data-section="quotes"><i class="bi bi-chat-quote me-2"></i> Quotes</a>
        </nav>
        <div class="mt-auto pt-4 border-top border-secondary-subtle">
            <a class="nav-link" href="#" onclick="importData()"><i class="bi bi-upload me-2"></i> Import Data</a>
            <a class="nav-link" href="#" onclick="exportData()"><i class="bi bi-download me-2"></i> Export Data</a>
        </div>
    </div>

    <div id="page-content">
        <header class="bg-white shadow-sm p-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-dark d-md-none me-2 p-0 text-decoration-none" id="sidebar-toggle"><i class="bi bi-list fs-2"></i></button>
                <h4 id="section-title" class="m-0">Dashboard</h4>
            </div>
            <form id="quick-add-task-form" class="input-group d-none flex-grow-1 mx-md-4 order-3 order-md-2 w-100 w-md-auto mt-2 mt-md-0">
                <input type="text" class="form-control" id="quick-add-task-input" placeholder="Add a task for today...">
                <button class="btn btn-primary" type="submit">Quick Add</button>
            </form>
            <div class="text-end order-2 order-md-3">
                <div id="current-date" class="text-muted small"></div>
            </div>
        </header>

        <main class="p-4" id="main-render">
            </main>
    </div>
</div>

<!-- Add Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addTaskForm">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="taskTitle" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="taskDate" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="taskDate" required>
                        </div>
                        <div class="col">
                            <label for="taskPriority" class="form-label">Priority</label>
                            <select class="form-select" id="taskPriority">
                                <option value="1">Low</option>
                                <option value="3" selected>Medium</option>
                                <option value="5">High</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="taskSegment" class="form-label">Life Segment</label>
                        <select class="form-select" id="taskSegment">
                            <option value="">General</option>
                            <option value="God">God</option>
                            <option value="Finance">Finance</option>
                            <option value="Health">Health</option>
                            <option value="Leisure">Leisure</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="taskRecurring">
                        <label class="form-check-label" for="taskRecurring">Recurring Task?</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="saveNewTask()">Save Task</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Task Modal -->
<div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <input type="hidden" id="editTaskId">
                    <div class="mb-3">
                        <label for="editTaskTitle" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="editTaskTitle" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="editTaskDate" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="editTaskDate" required>
                        </div>
                        <div class="col">
                            <label for="editTaskPriority" class="form-label">Priority</label>
                            <select class="form-select" id="editTaskPriority">
                                <option value="1">Low</option>
                                <option value="3">Medium</option>
                                <option value="5">High</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="editTaskSegment" class="form-label">Life Segment</label>
                        <select class="form-select" id="editTaskSegment">
                            <option value="">General</option>
                            <option value="God">God</option>
                            <option value="Finance">Finance</option>
                            <option value="Health">Health</option>
                            <option value="Leisure">Leisure</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-danger" onclick="deleteTask()">Delete Task</button>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="updateTask()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Recipe Modal -->
<div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="recipeModalTitle">Add Recipe</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="recipeForm">
                    <input type="hidden" id="recipeId">
                    <div class="mb-3">
                        <label for="recipeName" class="form-label">Recipe Name</label>
                        <input type="text" class="form-control" id="recipeName" required>
                    </div>
                    <div class="mb-3">
                        <label for="recipeInstructions" class="form-label">Instructions</label>
                        <textarea class="form-control" id="recipeInstructions" rows="5"></textarea>
                    </div>
                    <hr>
                    <h6>Ingredients</h6>
                    <div id="ingredient-fields">
                        <!-- Ingredient fields will be dynamically added here -->
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="addIngredientField()">+ Add Ingredient</button>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-danger" id="deleteRecipeBtn" onclick="deleteRecipe()">Delete</button>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveRecipe()">Save Recipe</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Grocery List Modal -->
<div class="modal fade" id="groceryListModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Weekly Grocery List</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="grocery-list-content">
                <!-- Generated list will be injected here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="copyGroceryList()">Copy List</button>
            </div>
        </div>
    </div>
</div>

<!-- Bible Study Modal -->
<div class="modal fade" id="bibleStudyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="bibleStudyModalTitle">Add Bible Study</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="bibleStudyForm">
                    <input type="hidden" id="bibleStudyId">
                    <div class="mb-3">
                        <label for="studyName" class="form-label">Study Name / Topic</label>
                        <input type="text" class="form-control" id="studyName" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="studyType" class="form-label">Type</label>
                            <select class="form-select" id="studyType">
                                <option value="Book">Book of Bible</option>
                                <option value="Topic">Topical</option>
                                <option value="Character">Character Study</option>
                                <option value="Devotional">Devotional</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="studyPriority" class="form-label">Priority</label>
                            <select class="form-select" id="studyPriority">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="studyStatus" class="form-label">Status</label>
                            <select class="form-select" id="studyStatus">
                                <option value="Not Started">Not Started</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="studyBible" class="form-label">Bible Used</label>
                            <input type="text" class="form-control" id="studyBible" placeholder="e.g. ESV, NIV">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="studyPrereq" class="form-label">Prerequisite (Optional)</label>
                        <select class="form-select" id="studyPrereq">
                            <option value="">None</option>
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-danger" id="deleteStudyBtn" onclick="deleteBibleStudy()" style="display:none;">Delete</button>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveBibleStudy()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Quote Modal -->
<div class="modal fade" id="quoteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="quoteModalTitle">Add Quote</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="quoteForm">
                    <input type="hidden" id="quoteId">
                    <div class="mb-3">
                        <label for="quoteText" class="form-label">Quote</label>
                        <textarea class="form-control" id="quoteText" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="quoteSource" class="form-label">Source (Book/Movie/Song Title)</label>
                        <input type="text" class="form-control" id="quoteSource" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="quoteAuthor" class="form-label">Author/Speaker</label>
                            <input type="text" class="form-control" id="quoteAuthor">
                        </div>
                        <div class="col">
                            <label for="quoteType" class="form-label">Type</label>
                            <select class="form-select" id="quoteType">
                                <option value="Book">Book</option>
                                <option value="Movie">Movie</option>
                                <option value="Song">Song</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-danger" id="deleteQuoteBtn" onclick="deleteQuote()" style="display:none;">Delete</button>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveQuote()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toast-body">
                <!-- Message injected here -->
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
